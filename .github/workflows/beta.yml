name: Build beta prerelease
on:
  push:
    branches: ["beta/**"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new beta prerelease
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: beta-release
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.DELTA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DELTA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/delta.jks"
          echo "DELTA_KEYSTORE_FILE=$RUNNER_TEMP/delta.jks" >> "$GITHUB_ENV"
          echo "DELTA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build isolated beta
        run: ./gradlew :app:assembleRelease -Pdelta.channel=beta
      - name: Build optional Stage 1 transfer helper
        run: |
          python3 ci/prepare-beta-transfer.py "$RUNNER_TEMP/transfer-source"
          cd "$RUNNER_TEMP/transfer-source"
          env -u GITHUB_RUN_NUMBER ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Delta-Transfer-0.1.34-transfer.apk"
      - name: Collect versioned beta
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          cp app/build/outputs/apk/release/app-release.apk "Delta-Beta-$VERSION.apk"
          echo "BETA_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build optional base-package return candidate
        run: |
          ./gradlew :app:assembleRelease -Pdelta.channel=stable
          RETURN_VERSION=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          cp app/build/outputs/apk/release/app-release.apk "Delta-Return-$RETURN_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Delta-Beta-${{ env.BETA_VERSION }}
          path: |
            Delta-Beta-*.apk
            Delta-Transfer-*.apk
            Delta-Return-*.apk
      - name: Publish prerelease only
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "stage2-beta-$BETA_VERSION" "Delta-Beta-$BETA_VERSION.apk" Delta-Transfer-0.1.34-transfer.apk Delta-Return-*.apk --prerelease --latest=false --target "$GITHUB_SHA" --title "Delta Beta $BETA_VERSION" --notes-file docs/BETA.md
