name: Smoke test

# Runs the app on an Android emulator and photographs it, so a build that
# compiles but crashes or draws wrongly is caught before anyone installs it.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app and its test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-output

      # The pictures are also written into the log as text so they can be read
      # without downloading the artifact.
      - name: Print screenshots
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick > /dev/null 2>&1 || true
          IM=$(command -v magick || command -v convert || true)
          shopt -s nullglob
          for f in smoke-output/smoke/*.png; do
            name=$(basename "$f" .png)
            if [ -n "$IM" ]; then
              "$IM" "$f" -resize '540x>' -quality 72 "/tmp/$name.jpg" && f="/tmp/$name.jpg"
            fi
            echo "@@IMG $name $(basename "$f")"
            base64 -w 100 "$f"
            echo "@@END $name"
          done
