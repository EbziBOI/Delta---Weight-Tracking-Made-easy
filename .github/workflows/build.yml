name: Build APK

# Every push to main or to a working branch produces an installable APK,
# published as a release so it can be downloaded straight onto a phone:
# https://github.com/EbziBOI/Delta---Weight-Tracking-Made-easy/releases/latest/download/Delta.apk

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android only installs an update over an existing app when both are signed
      # with the same key. The key lives in repository secrets, never in the repo.
      # Release builds must never use a new key on each run: Android would reject updates.
      # Run ci/setup-signing.sh once to configure the repository secrets.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DELTA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DELTA_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/delta.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Pasted secrets often pick up stray spaces or line breaks; ignore them.
            KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
            printf '%s' "$KEYSTORE_B64" | base64 --decode --ignore-garbage > "$KEYSTORE"
            if ! keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias delta > /dev/null 2>&1; then
              echo "::error::The stored signing key could not be opened. Check the DELTA_KEYSTORE_B64 and DELTA_KEYSTORE_PASSWORD secrets."
              exit 1
            fi
            echo "Signed with the stored key: this build installs over earlier ones." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Release signing secrets are missing. Run ci/setup-signing.sh and configure DELTA_KEYSTORE_B64 and DELTA_KEYSTORE_PASSWORD before publishing an APK."
            exit 1
          fi
          echo "DELTA_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "DELTA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Delta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Delta-apk
          path: Delta.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # Re-running a build keeps its number, so replace the file if the release already exists.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" Delta.apk --clobber
          else
            gh release create "$TAG" Delta.apk \
              --title "Delta build ${{ github.run_number }}" \
              --notes "Built from ${{ github.sha }} on ${{ github.ref_name }}." \
              --target "${{ github.sha }}"
          fi
