name: Build APK

# Every push to main or to a working branch produces an installable APK,
# published as a release so it can be downloaded straight onto a phone:
# https://github.com/EbziBOI/Delta---Weight-Tracking-Made-easy/releases/latest/download/Delta.apk

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android only installs an update over an existing app when both are signed
      # with the same key. The key lives in repository secrets, never in the repo.
      # Without the secrets the build still works, but is signed with a throwaway
      # key, so installing it means uninstalling the previous build first.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.DELTA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DELTA_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/delta.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            echo "Signed with the stored key: this build installs over earlier ones." >> "$GITHUB_STEP_SUMMARY"
          else
            KEYSTORE_PASSWORD="throwaway-$GITHUB_RUN_ID"
            keytool -genkeypair -keystore "$KEYSTORE" -alias delta -keyalg EC -groupname secp256r1 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Delta throwaway build"
            echo "::warning::No signing secrets set. Signed with a throwaway key, so this build cannot update an earlier install."
            echo "Signed with a throwaway key: uninstall the previous build before installing this one." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "DELTA_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DELTA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Delta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Delta-apk
          path: Delta.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Delta.apk \
            --title "Delta build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }} on ${{ github.ref_name }}." \
            --target "${{ github.sha }}"
